name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/quirks

defaults:
  run:
    working-directory: quirks

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: quirks

      - uses: jdx/mise-action@v2
        with:
          working_directory: quirks

      - uses: taiki-e/install-action@nextest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            quirks/target
          key: cargo-${{ hashFiles('quirks/Cargo.lock', 'quirks/rust-toolchain.toml') }}
          restore-keys: |
            cargo-

      - run: mise run check
      - run: mise run test
      - run: mise run package

      - uses: actions/upload-artifact@v7
        with:
          name: alaydriem-quirks-${{ github.sha }}-windows-x64
          path: quirks/dist/@alaydriem/quirks/
