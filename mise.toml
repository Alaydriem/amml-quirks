[tasks.preflight]
description = "Names a missing toolchain or tool before a build turns it into an obscure error"
dir = "{{config_root}}"
run = [
  "rustc --version",
  "cargo --version",
  "cargo nextest --version",
]

[tasks.check]
description = "Compiles, runs clippy with warnings denied and checks formatting"
dir = "{{config_root}}"
run = [
  "cargo check --workspace --all-targets",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo fmt --all --check",
]

[tasks.test]
description = "Every test through cargo nextest run"
dir = "{{config_root}}"
run = "cargo nextest run --workspace"

[tasks.package]
description = "Builds dist/@alaydriem/quirks/ (alaydriem_quirks.dll, amml.hcl), the release artifact"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -e
cargo build --release -p quirks-amml
rm -rf dist/alaydriem-quirks dist/@alaydriem/quirks
mkdir -p dist/@alaydriem/quirks
cp target/release/alaydriem_quirks.dll dist/@alaydriem/quirks/alaydriem_quirks.dll
cp quirks/amml/amml.hcl dist/@alaydriem/quirks/amml.hcl
cp quirks/amml/icon.png dist/@alaydriem/quirks/icon.png
echo "built dist/@alaydriem/quirks"
'''

[tasks.install]
description = "Runs package, then copies dist/@alaydriem/quirks into mods/amml/@alaydriem/quirks of an AMML instance under %LOCALAPPDATA%/amml/instances (--instance, default 1.26.62.01). The mod's config/ stays. Close the game first: a running game locks the DLL"
depends = ["package"]
dir = "{{config_root}}"
shell = "bash -c"
usage = '''
flag "--instance <name>" default="1.26.62.01" help="The instance folder under %LOCALAPPDATA%/amml/instances"
'''
run = '''
set -e
[ -n "$LOCALAPPDATA" ] || { echo "LOCALAPPDATA is not set; the instances live under %LOCALAPPDATA%/amml/instances"; exit 1; }
instance="$LOCALAPPDATA/amml/instances/${usage_instance:-1.26.62.01}"
[ -f "$instance/Minecraft.Windows.exe" ] || { echo "no instance at $instance"; exit 1; }
target="$instance/mods/amml/@alaydriem/quirks"
mkdir -p "$target"
cp -r dist/@alaydriem/quirks/. "$target/"
echo "installed dist/@alaydriem/quirks -> $target"
'''
