[package]
name = "quirks-amml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lib]
name = "alaydriem_quirks"
crate-type = ["cdylib", "rlib"]

[features]
# A build for the in-game proof of the idle-screen refusal only: the keep-alive never fires, so the game asks for
# the idle screen after 15 minutes with no input. Never shipped
test-no-keep-alive = []

[dependencies]
quirks-core.workspace = true
amml-api.workspace = true
amm-client.workspace = true
amm-core.workspace = true
curia.workspace = true
hcl-rs.workspace = true
serde.workspace = true

[dev-dependencies]
amml-api = { workspace = true, features = ["test"] }
amm-client = { workspace = true, features = ["test-support"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[[example]]
name = "write_manifest"
path = "examples/write_manifest.rs"

[lints]
workspace = true
